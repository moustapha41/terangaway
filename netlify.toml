# Déploiement Netlify du site visiteurs (apps/web).
#
# Ce fichier est à la racine du dépôt, donc Netlify le trouve sans « base
# directory » : laissez ce champ vide dans l'interface. Les chemins ci-dessous
# partent de cette racine.

[build]
  # Les paquets de l'atelier sont publiés en TypeScript brut et compilés par
  # Next (transpilePackages) ; le theme.css des jetons est versionné. Rien à
  # construire avant, donc pas besoin de turbo ici.
  command = "pnpm -F @teranga/web build"
  publish = "apps/web/.next"

[build.environment]
  # Le projet exige >= 20.11 ; Netlify démarre plus bas par défaut.
  NODE_VERSION = "22"
  # Le site part sur les fixtures : l'API NestJS est un serveur permanent, et
  # Netlify ne sert que des fonctions courtes. Le jour où l'API est hébergée
  # ailleurs, passer à "false" et ajouter API_URL dans l'interface — une
  # variable d'interface l'emporte sur ce fichier.
  NEXT_PUBLIC_API_MOCK = "true"

# Déclaré plutôt que laissé à la détection : dans un monorepo, elle rate parfois
# l'application quand le dossier publié n'est pas à la racine.
[[plugins]]
  package = "@netlify/plugin-nextjs"
