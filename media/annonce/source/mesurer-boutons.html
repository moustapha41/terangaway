<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="o">…</pre>
<iframe id="v" style="width:1280px;border:0"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const f = document.getElementById("v");
  f.style.height = (p.get("h") || 2000) + "px";
  f.src = p.get("u");
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument;
    const cible = p.get("texte");
    const candidats = [...d.querySelectorAll("button, a")];
    const el = candidats.find((x) => x.textContent.trim().includes(cible));
    if (!el) {
      document.getElementById("o").textContent = "INTROUVABLE : " + cible;
      return;
    }
    const r = el.getBoundingClientRect();
    document.getElementById("o").textContent = JSON.stringify({
      texte: el.textContent.trim().slice(0, 40),
      x: Math.round(r.x + r.width / 2),
      y: Math.round(r.y + r.height / 2),
      l: Math.round(r.x), t: Math.round(r.y),
      w: Math.round(r.width), h: Math.round(r.height),
    });
  }, 2500);
</script></body></html>
