# Essai local de la pile, sans Dokploy ni Traefik.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Les ports publiés évitent 3000 et 443, pris sur le serveur de déploiement ;
# autant garder les mêmes ici pour que les deux environnements se ressemblent.
# Le site répond alors sur http://localhost:3100 et l'API sur
# http://localhost:3101/documentation.

services:
  postgres:
    ports:
      - "5432:5432"

  api:
    ports:
      - "3101:3101"
    environment:
      # Les raccourcis de démonstration — compte `visiteur-demo`, code OTP fixe,
      # code renvoyé dans la réponse, session résolue depuis un identifiant de
      # compte — sont à refus par défaut dans l'API. Ils se réclament ici, et
      # **uniquement** dans ce fichier d'essai local, jamais dans
      # `docker-compose.yml` qui sert la production.
      #
      # `NODE_ENV=production` les referme de toute façon : c'est volontairement
      # un double verrou. Sur le déploiement public, ces accès étaient restés
      # ouverts parce qu'une seule variable les gardait.
      AUTORISER_COMPTES_DEMO: "true"

  web:
    ports:
      - "3100:3100"

  umami:
    ports:
      # Tableau de bord d'audience sur http://localhost:3102
      - "3102:3000"

networks:
  # En local, personne n'a installé Dokploy : le réseau est créé à la volée.
  dokploy-network:
    external: false
