# Pile de production Teranga Way — Déploiement Dokploy sur VPS
#
# Services :
# 1. postgres : Base relationnelle PostgreSQL 16 avec volume persistant et réseau privé strict.
# 2. api      : Backend NestJS 10 (exposé en interne sur le port 3101 et joignable par Traefik).
# 3. web      : Frontend Next.js 15 (exposé sur le port 3100, routé par Traefik via dokploy-network).
#
# Routage Dokploy / Traefik :
# - Dokploy et Traefik utilisent le réseau Docker externe « dokploy-network ».
# - Le service « web » est routé vers le domaine principal (ex: https://terangaway.sn).
# - Le service « api » peut facultativement être routé vers un sous-domaine (ex: https://api.terangaway.sn).
# - Le service « postgres » n'est JAMAIS publié sur Internet ni relié à dokploy-network.
#
# Pour tester en local sans Dokploy :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teranga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teranga}
      POSTGRES_DB: ${POSTGRES_DB:-teranga}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-teranga} -d $${POSTGRES_DB:-teranga}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      interne:
        aliases:
          - postgres-interne

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3101"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-teranga}:${POSTGRES_PASSWORD:-teranga}@postgres:5432/${POSTGRES_DB:-teranga}?schema=public}
      ORIGINES_AUTORISEES: ${ORIGINES_AUTORISEES:-https://teranga-way.com,http://localhost:3100}
      DUREE_JETON_MINUTES: ${DUREE_JETON_MINUTES:-120}
      DELAI_REPONSE_MINUTES: ${DELAI_REPONSE_MINUTES:-120}
      DELAI_MINIMUM_HEURES: ${DELAI_MINIMUM_HEURES:-2}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-Teranga Way <auth@teranga-way.com>}
      APP_URL: ${APP_URL:-https://teranga-way.com}
      OTP_SECRET: ${OTP_SECRET}
      # Les adresses d'équipe qui ouvrent /admin. Vide, personne n'entre :
      # `pnpm db:seed` les promeut au rôle ADMINISTRATEUR.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Voir .env.example : à n'ouvrir qu'avec le pare-feu restreint à Cloudflare.
      DERRIERE_CLOUDFLARE: ${DERRIERE_CLOUDFLARE:-false}
      # Secret partagé avec le site pour /comptes/oauth/google. Laissé vide,
      # la route s'en remet au seul isolement du réseau interne.
      SECRET_OAUTH_INTERNE: ${SECRET_OAUTH_INTERNE:-}
    expose:
      - "3101"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '3101') + '/sante').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      interne:
        aliases:
          - api-interne

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_MOCK: ${NEXT_PUBLIC_API_MOCK:-false}
        ORIGINES_ACTIONS: ${ORIGINES_ACTIONS:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Connexion Google. Vides tant que le client OAuth n'est pas renseigné
      # dans Dokploy : le bouton n'est alors simplement pas proposé.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SECRET_OAUTH_INTERNE: ${SECRET_OAUTH_INTERNE:-}
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
      API_URL: ${API_URL:-http://api-interne:3101}
      # Mesure d'audience. Vides tant qu'Umami n'est pas configuré : le script
      # n'est alors pas posé du tout. Elles doivent figurer **ici** et pas
      # seulement dans l'environnement de Dokploy — une variable déclarée là-bas
      # ne sert qu'à la substitution `${...}` de ce fichier, elle n'entre pas
      # dans le conteneur si le service ne la nomme pas.
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_SITE_ID: ${UMAMI_SITE_ID:-}
      # Même valeur que celle donnée au conteneur Umami : c'est le chemin où il
      # sert son script.
      UMAMI_TRACKER_SCRIPT_NAME: ${UMAMI_TRACKER_SCRIPT_NAME:-mesure}
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '3100') + '/api/sante').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - interne
      - dokploy-network

  # ─── Mesure d'audience ──────────────────────────────────────────────────────
  #
  # Umami plutôt que Google Analytics : sans cookie, donc **sans bandeau de
  # consentement** (loi sénégalaise 2008-12, RGPD pour les visiteurs européens),
  # et les données restent sur ce serveur. Plutôt que Plausible : celui-ci exige
  # ClickHouse en plus, quand Umami se contente du PostgreSQL déjà là.
  #
  # Il vit dans son propre schéma de la base existante : aucune base à créer,
  # aucun volume de plus, et une sauvegarde unique couvre tout.
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: ${UMAMI_DATABASE_URL:-postgresql://${POSTGRES_USER:-teranga}:${POSTGRES_PASSWORD:-teranga}@postgres:5432/${POSTGRES_DB:-teranga}?schema=umami}
      # Signe les jetons de session du tableau de bord. `openssl rand -hex 32`.
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Le script s'appelle « script.js » par défaut, nom que les bloqueurs
      # reconnaissent. Le renommer rend la mesure plus fidèle.
      TRACKER_SCRIPT_NAME: ${UMAMI_TRACKER_SCRIPT_NAME:-mesure}
      DISABLE_TELEMETRY: "1"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/heartbeat').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - interne
      - dokploy-network
    # Routage écrit à la main, et non par l'onglet « Domains » de Dokploy :
    # celui-ci n'a jamais produit de label pour ce service, et Traefik répondait
    # 404 avec son certificat par défaut faute de routeur pour l'hôte. Les noms
    # d'entrypoints, le middleware de redirection et le résolveur reprennent
    # exactement ceux que Dokploy pose sur `web`.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.teranga-way-umami-web.rule=Host(`stats.teranga-way.com`)
      - traefik.http.routers.teranga-way-umami-web.entrypoints=web
      - traefik.http.routers.teranga-way-umami-web.service=teranga-way-umami-web
      - traefik.http.routers.teranga-way-umami-web.middlewares=redirect-to-https@file
      - traefik.http.services.teranga-way-umami-web.loadbalancer.server.port=3000
      - traefik.http.routers.teranga-way-umami-websecure.rule=Host(`stats.teranga-way.com`)
      - traefik.http.routers.teranga-way-umami-websecure.entrypoints=websecure
      - traefik.http.routers.teranga-way-umami-websecure.service=teranga-way-umami-websecure
      - traefik.http.routers.teranga-way-umami-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.teranga-way-umami-websecure.loadbalancer.server.port=3000

volumes:
  postgres_data:

networks:
  # Réseau privé interne non exposé à l'extérieur
  interne:
  # Réseau Docker externe créé et géré par Dokploy pour l'entrée Traefik
  dokploy-network:
    external: true
